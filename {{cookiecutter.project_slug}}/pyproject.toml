[project]
name = "{{ cookiecutter.project_name }}"
version = "0.1.0"
authors = [
    { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" },
]

description = "{{ cookiecutter.project_description }}"
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version_min }},<{{ cookiecutter.python_version_max }}"
dependencies = [
    "pre-commit>=3.8.0",
    "pytest>=8.3.2",
    "ruff>=0.6.3",
]

[project.urls]
Source = "https://github.com/{{ cookiecutter.author_name }}/{{ cookiecutter.project_name }}"
Issues = "https://github.com/{{ cookiecutter.author_name }}/{{ cookiecutter.project_name }}/issues"
Changelog = "https://github.com/{{ cookiecutter.author_name }}/{{ cookiecutter.project_name }}/releases"
License = "https://github.com/{{ cookiecutter.author_name }}/{{ cookiecutter.project_name }}/blob/main/LICENSE"


[project.scripts]
{{ cookiecutter.project_name }} = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
