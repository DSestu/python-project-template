[project]
name = "{{ cookiecutter.project_slug }}"
version = "{{ cookiecutter.version }}"
authors = [
    { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" },
]

description = "{{ cookiecutter.project_description }}"
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version_min }},<{{ cookiecutter.python_version_max }}"
dependencies = [
    "pre-commit>=3.8.0",
    "pytest>=8.3.2",
    "ruff>=0.6.3",
]

[project.urls]
Source = "https://github.com/{{ cookiecutter.author_name }}/{{ cookiecutter.project_slug }}"
Issues = "https://github.com/{{ cookiecutter.author_name }}/{{ cookiecutter.project_slug }}/issues"
Changelog = "https://github.com/{{ cookiecutter.author_name }}/{{ cookiecutter.project_slug }}/releases"
License = "https://github.com/{{ cookiecutter.author_name }}/{{ cookiecutter.project_slug }}/blob/main/LICENSE"


[project.scripts]
{{ cookiecutter.project_slug }} = "{{ cookiecutter.app_name }}.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["{{ cookiecutter.app_name }}"]